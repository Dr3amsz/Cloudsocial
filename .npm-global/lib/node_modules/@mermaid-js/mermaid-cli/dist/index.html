<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSocial - Sosial Media Anda</title>
    <!-- Menggunakan CDN Bootstrap agar pasti berjalan lancar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar Khusus Landing Page -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" style="background: rgba(74, 159, 196, 0.95); backdrop-filter: blur(10px);">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">
                <span class="brand-text fw-bold">CloudSocial</span>
            </a>
            
            <div class="d-flex gap-3">
                <button class="btn btn-outline-light rounded-pill px-4 fw-bold" onclick="window.location.href='login.html'">Masuk</button>
                <button class="btn bg-white rounded-pill px-4 fw-bold" style="color: var(--primary);" onclick="window.location.href='register.html'">Daftar</button>
            </div>
        </div>
    </nav>

    <!-- Floating Clouds Background -->
    <div class="clouds-container">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>
        <div class="cloud cloud-4">☁️</div>
    </div>

    <div class="main-container">
        <!-- Area Landing Page -->
        <div id="landingPage" class="page-content active">
            <div class="container">
                <div class="row align-items-center min-vh-100">
                    <div class="col-lg-6 text-center text-lg-start mb-5 mb-lg-0">
                        <div class="landing-content">
                            <h1 class="display-3 fw-bold mb-4 animate-fade-in">
                                Selamat Datang di <span class="gradient-text">CloudSocial</span>
                            </h1>
                            <p class="lead mb-4 animate-fade-in-delay text-dark">
                                Terhubung dengan teman, berbagi momen, dan ciptakan kenangan bersama di platform sosial media modern yang dibuat untuk Anda.
                            </p>
                            <div class="d-flex gap-3 justify-content-center justify-content-lg-start animate-fade-in-delay-2">
                                <button class="btn btn-primary btn-lg" onclick="window.location.href='register.html'">
                                    Mulai Sekarang ✨
                                </button>
                                <button class="btn btn-outline-light btn-lg" onclick="window.location.href='login.html'">
                                    Masuk
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="landing-illustration">
                            <div class="illustration-card">
                                <div class="floating-element">🌤️</div>
                                <div class="floating-element delay-1">⭐</div>
                                <div class="floating-element delay-2">💭</div>
                                <div class="floating-element delay-3">🎈</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Script CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
