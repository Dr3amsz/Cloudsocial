<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - CloudSocial</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-light fixed-top shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand d-none d-md-block" href="feed.html">
                <span class="brand-text">CloudSocial</span>
            </a>
            
            <ul class="navbar-nav mx-auto mx-md-0 d-flex flex-row gap-4">
                <li class="nav-item">
                    <a class="nav-link" href="feed.html" title="Beranda">
                        <span style="font-size: 1.5rem;">🏠</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="openCreatePostModal()" title="Posting">
                        <span style="font-size: 1.5rem;">➕</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="profile.html" title="Profil">
                        <span style="font-size: 1.5rem;">👤</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()" title="Keluar">
                        <span style="font-size: 1.5rem;">🚪</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="clouds-container">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>
    </div>

    <div class="main-container">
        <div id="profilePage" class="page-content active">
            <div class="container py-5">
                <div class="profile-header mb-4">
                    <div class="profile-cover"></div>
                    <div class="profile-info-container text-center text-md-start">
                        <div class="d-md-flex align-items-end gap-4 px-4">
                            <div class="profile-img-wrapper">
                                <img src="" alt="Profile" class="profile-img-large shadow" id="mainProfileImg">
                                <label for="profileUpload" class="upload-badge" title="Ganti Foto Profil">
                                    📷
                                    <input type="file" id="profileUpload" hidden accept="image/*" onchange="handleProfilePhotoUpload(event)">
                                </label>
                            </div>
                            <div class="flex-grow-1 mb-2 mt-3 mt-md-0">
                                <h2 class="mb-1" id="profileNameDisplay">User Name</h2>
                                <p class="text-muted mb-0" id="profileBioDisplay">Halo! Saya menggunakan CloudSocial.</p>
                            </div>
                            <div class="mb-2">
                                <button class="btn btn-outline-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                    ⚙️ Edit Profil
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8 mx-auto">
                        <h4 class="mb-4">Postingan Saya ✨</h4>
                        <div id="userPostsContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label class="form-label">Nama</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Bio</label>
                            <textarea class="form-control" id="editBio" rows="3" placeholder="Ceritakan tentang diri Anda..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">💾 Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createPostModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Buat Postingan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createPostForm">
                        <div class="mb-3">
                            <textarea class="form-control" id="postContent" rows="4" placeholder="Apa yang ingin Anda bagikan? ✨" required></textarea>
                        </div>
                        <div class="mb-3">
                            <input type="file" class="form-control" id="postImage" accept="image/*">
                            <div id="imagePreview" class="mt-3"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">🚀 Posting</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
