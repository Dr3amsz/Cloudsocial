<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - CloudSocial</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clouds-container">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>
        <div class="cloud cloud-4">☁️</div>
    </div>

    <div class="main-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="auth-card p-4 shadow-lg" style="max-width: 400px; width: 100%; z-index: 10;">
            <div class="text-center mb-4">
                <h2 class="brand-text" style="font-size: 2rem;">CloudSocial</h2>
                <p class="text-muted">Senang melihatmu kembali! ✨</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="nama@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">🚀 Masuk Sekarang</button>
                
                <div class="text-center">
                    <p class="mb-0 text-muted">Belum punya akun? 
                        <a href="register.html" class="text-primary text-decoration-none fw-bold">Daftar</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
